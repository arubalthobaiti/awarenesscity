<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدينة الوعي</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="stk" x="-8%" y="-8%" width="116%" height="116%"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
<header id="topbar" class="noprint" hidden>
  <div class="tb-row">
    <span class="chip" id="tbName"></span>
    <div class="bar"><i id="barFill"></i><b id="barText"></b></div>
    <span class="chip">★ <span id="tbStars">0</span></span>
    
  </div>
  <div id="path"></div>
</header>
<main id="app"><noscript>فضلًا فعّلي JavaScript لتشغيل اللعبة.</noscript></main>
<footer class="project-credit noprint" aria-label="عن تطوير اللعبة">
  <span>فكرة وتصميم وتطوير: <bdi dir="ltr">arubalthobaiti</bdi></span>
  <span class="credit-ai">بمساعدة تقنيات الذكاء الاصطناعي</span>
</footer>
<div id="fx"></div>
<div id="toast"></div>

<script src="form-config.js"></script>
<script src="game.min.js"></script>
</body>
</html>
